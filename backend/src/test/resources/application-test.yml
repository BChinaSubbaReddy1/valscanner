spring:
  datasource:
    url: jdbc:h2:mem:vulnscanner;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: false

app:
  security:
    jwt:
      secret: test-secret-key-that-is-long-enough-for-jwt-1234567890
      expiration-ms: 3600000
      blacklist-enabled: true
  bootstrap:
    super-admin:
      email: ${INITIAL_SUPER_ADMIN_EMAIL:}
      password: ${INITIAL_SUPER_ADMIN_PASSWORD:}
