# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/scanner?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mysql@31082}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security & JWT configuration (minimum 256-bit secret required for HMAC-SHA256)
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.security.jwt.blacklist-enabled=true

# Predefined SUPER_ADMIN bootstrap (see RoleInitializer). Leave both blank to skip bootstrap
# entirely (safe default for an existing database that already has a SUPER_ADMIN). If a new
# account must be created for the configured email, a password is required or startup fails fast.
# These must match the INITIAL_SUPER_ADMIN_EMAIL / INITIAL_SUPER_ADMIN_PASSWORD vars in .env.example.
app.bootstrap.super-admin.email=${INITIAL_SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin.password=${INITIAL_SUPER_ADMIN_PASSWORD:}

# Server port
server.port=1080

# Actuator management endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Passive scan execution limits
scanner.allowed-private-target-origins=${SCANNER_ALLOWED_PRIVATE_TARGET_ORIGINS:http://localhost:5173}
scanner.localhost-target-origin-mapping=${SCANNER_LOCALHOST_TARGET_ORIGIN_MAPPING:}
scanner.executor.core-pool-size=${SCANNER_EXECUTOR_CORE_POOL_SIZE:2}
scanner.executor.max-pool-size=${SCANNER_EXECUTOR_MAX_POOL_SIZE:4}
scanner.executor.queue-capacity=${SCANNER_EXECUTOR_QUEUE_CAPACITY:20}
scanner.max-requests=${SCANNER_MAX_REQUESTS:10}
scanner.max-detection-requests=${SCANNER_MAX_DETECTION_REQUESTS:6}
scanner.request-timeout-seconds=${SCANNER_REQUEST_TIMEOUT_SECONDS:15}
# Exact absolute form-action URLs, one per line; empty by default.
scanner.active-post-form-allowlist=${SCANNER_ACTIVE_POST_FORM_ALLOWLIST:}

# OWASP ZAP configuration
scanner.zap.enabled=${SCANNER_ZAP_ENABLED:true}
scanner.zap.base-url=${SCANNER_ZAP_BASE_URL:http://localhost:8090}
scanner.zap.api-key=${SCANNER_ZAP_API_KEY:}
scanner.zap.connect-timeout-seconds=${SCANNER_ZAP_CONNECT_TIMEOUT_SECONDS:5}
scanner.zap.read-timeout-seconds=${SCANNER_ZAP_READ_TIMEOUT_SECONDS:15}
scanner.zap.max-duration-seconds=${SCANNER_ZAP_MAX_DURATION_SECONDS:90}
