spring:
  datasource:
    url: jdbc:mysql://localhost:3306/vulnscanner?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:change_me}
    password: ${DB_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: ${JWT_SECRET:replace-with-strong-random-secret}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      blacklist-enabled: true
  bootstrap:
    super-admin:
      # Leave both blank to skip bootstrap (safe default once a SUPER_ADMIN already exists).
      email: ${INITIAL_SUPER_ADMIN_EMAIL:}
      password: ${INITIAL_SUPER_ADMIN_PASSWORD:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
