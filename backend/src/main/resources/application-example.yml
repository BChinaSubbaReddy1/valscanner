spring:
  datasource:
    url: jdbc:mysql://localhost:3306/vulnscanner?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}

app:
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${MAIL_FROM:${EMAIL_FROM:}}
  auth:
    login-otp:
      expiration-seconds: ${LOGIN_OTP_EXPIRATION_SECONDS:300}
      resend-cooldown-seconds: ${LOGIN_OTP_RESEND_COOLDOWN_SECONDS:60}
      rate-window-seconds: ${LOGIN_OTP_RATE_WINDOW_SECONDS:900}
      max-attempts: ${LOGIN_OTP_MAX_ATTEMPTS:5}
      max-resends: ${LOGIN_OTP_MAX_RESENDS:3}
      max-sends-per-window: ${LOGIN_OTP_MAX_SENDS_PER_WINDOW:5}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      blacklist-enabled: true
  bootstrap:
    super-admin:
      # Leave both blank to skip bootstrap (safe default once a SUPER_ADMIN already exists).
      email: ${INITIAL_SUPER_ADMIN_EMAIL:}
      password: ${INITIAL_SUPER_ADMIN_PASSWORD:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
