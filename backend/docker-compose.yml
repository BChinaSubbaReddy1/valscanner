services:
  mysql:
    image: mysql:8.0
    container_name: vulnscanner-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting}
      MYSQL_DATABASE: scanner
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - vulnscanner-lab
    volumes:
      - vulnscanner-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:?Set DB_PASSWORD in .env before starting}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vulnscanner-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/scanner?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_SMTP_SSL: ${MAIL_SMTP_SSL:-false}
      MAIL_CONNECTION_TIMEOUT_MS: ${MAIL_CONNECTION_TIMEOUT_MS:-5000}
      MAIL_READ_TIMEOUT_MS: ${MAIL_READ_TIMEOUT_MS:-5000}
      MAIL_WRITE_TIMEOUT_MS: ${MAIL_WRITE_TIMEOUT_MS:-5000}
      LOGIN_OTP_EXPIRATION_SECONDS: ${LOGIN_OTP_EXPIRATION_SECONDS:-300}
      LOGIN_OTP_RESEND_COOLDOWN_SECONDS: ${LOGIN_OTP_RESEND_COOLDOWN_SECONDS:-60}
      LOGIN_OTP_RATE_WINDOW_SECONDS: ${LOGIN_OTP_RATE_WINDOW_SECONDS:-900}
      LOGIN_OTP_MAX_ATTEMPTS: ${LOGIN_OTP_MAX_ATTEMPTS:-5}
      LOGIN_OTP_MAX_RESENDS: ${LOGIN_OTP_MAX_RESENDS:-3}
      LOGIN_OTP_MAX_SENDS_PER_WINDOW: ${LOGIN_OTP_MAX_SENDS_PER_WINDOW:-5}
      SERVER_PORT: 8080
      INITIAL_SUPER_ADMIN_EMAIL: ${INITIAL_SUPER_ADMIN_EMAIL:-}
      INITIAL_SUPER_ADMIN_PASSWORD: ${INITIAL_SUPER_ADMIN_PASSWORD:-}
      SCANNER_ALLOWED_PRIVATE_TARGET_ORIGINS: "${SCANNER_ALLOWED_PRIVATE_TARGET_ORIGINS:-http://juice-shop:3000,http://dvwa:80},http://localhost:5173,http://host.docker.internal:5173"
      SCANNER_LOCALHOST_TARGET_ORIGIN_MAPPING: ${SCANNER_LOCALHOST_TARGET_ORIGIN_MAPPING:-http://localhost:5173=http://host.docker.internal:5173}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8081}:8080"
    networks:
      - vulnscanner-lab

  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: vulnscanner-juice-shop
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - vulnscanner-lab

  dvwa-db:
    image: mariadb:10.11
    container_name: vulnscanner-dvwa-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DVWA_DB_ROOT_PASSWORD:-local-dvwa-root-password}
      MARIADB_DATABASE: dvwa
      MARIADB_USER: dvwa
      MARIADB_PASSWORD: ${DVWA_DB_PASSWORD:-local-dvwa-password}
    volumes:
      - vulnscanner-dvwa-data:/var/lib/mysql
    networks:
      - vulnscanner-lab
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: vulnscanner-dvwa
    restart: unless-stopped
    depends_on:
      dvwa-db:
        condition: service_healthy
    environment:
      DB_SERVER: dvwa-db
    ports:
      - "127.0.0.1:4280:80"
    networks:
      - vulnscanner-lab

volumes:
  vulnscanner-mysql-data:
  vulnscanner-dvwa-data:

networks:
  vulnscanner-lab:
    name: vulnscanner-lab
